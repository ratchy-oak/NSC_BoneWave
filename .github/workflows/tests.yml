name: BoneWave tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [BoneWave-AI, Prototype]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '${{ matrix.component }}/requirements.txt'
      - name: Install component dependencies
        run: python -m pip install -r '${{ matrix.component }}/requirements.txt' coverage==7.16.1
      - name: Run tests and measure coverage
        run: python tests/run_tests.py --component '${{ matrix.component }}'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.component }}
          path: test-results/latest/${{ matrix.component }}/
          if-no-files-found: warn

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/e2e/requirements.txt
            BoneWave-AI/requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run Chromium E2E
        run: python -m pytest tests/e2e -q --junitxml=test-results/latest/e2e/junit.xml
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: test-results/latest/e2e/
          if-no-files-found: warn
